# Stack do Portainer — mesmo padrão do n-store: Traefik na rede externa `web`,
# roteamento por Host via labels (sem publicar porta). É só subir a stack;
# o Traefik cuida do TLS (Let's Encrypt) assim que o DNS apontar pra VPS.
services:
  entreciclos:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.entreciclos.rule=Host(`entreciclos.nortixcode.com.br`)"
      - "traefik.http.routers.entreciclos.entrypoints=websecure"
      - "traefik.http.routers.entreciclos.tls=true"
      - "traefik.http.routers.entreciclos.tls.certresolver=lets-encrypt"
      - "traefik.http.services.entreciclos.loadbalancer.server.port=80"

networks:
  web:
    external: true
