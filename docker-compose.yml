# Stack do Portainer. Build method: Repository (aponta pra este repo) ou suba
# este arquivo como stack. Exponha a porta e aponte seu proxy do subdomínio
# (Nginx/Traefik/NPM) pra ela, igual ao portfólio.
services:
  entreciclos:
    build: .
    image: entre-ciclos-site:latest
    container_name: entre-ciclos-site
    restart: unless-stopped
    ports:
      - "8081:80"
    # --- Se você usa Traefik, descomente e ajuste ao seu entrypoint/certresolver ---
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.entreciclos.rule=Host(`entreciclos.nortixcode.com.br`)"
    #   - "traefik.http.routers.entreciclos.entrypoints=websecure"
    #   - "traefik.http.routers.entreciclos.tls.certresolver=le"
    #   - "traefik.http.services.entreciclos.loadbalancer.server.port=80"
