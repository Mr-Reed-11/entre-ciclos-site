server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Builds do jogo (zips grandes): força download.
    location /downloads/ {
        default_type application/octet-stream;
        add_header Content-Disposition "attachment";
    }

    # Estáticos com hash no nome são imutáveis.
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 30d;
        access_log off;
    }

    # HTML do SPA sempre revalidado, pra o index apontar pros assets do build
    # atual (senão o navegador serve um index.html velho após o redeploy).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    client_max_body_size 200m;
}
